[tool.poetry]
name = "rand-engine"
version = "0.7.0"
description = "Sink-agnostic synthetic data at NumPy speed from declarative specs, with related tables through pk/fk key columns; Faker composes on top."
authors = ["marcoaureliomenezes <marcoaurelioreislima@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/marcoaureliomenezes/rand_engine"
repository = "https://github.com/marcoaureliomenezes/rand_engine"
documentation = "https://github.com/marcoaureliomenezes/rand_engine/tree/master/docs"
keywords = ["synthetic-data", "random-data", "mock-data", "test-data", "numpy", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.urls]
Issues = "https://github.com/marcoaureliomenezes/rand_engine/issues"
Changelog = "https://github.com/marcoaureliomenezes/rand_engine/blob/master/CHANGELOG.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.1.1"
pandas = "^2.2.2"
pyarrow = "^23.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
faker = "^28.4.1"
pyspark = "^3.5.0"
setuptools = "^78.1.1"  # Required for PySpark on Python 3.12+ (distutils replacement) - Fixed CVE path traversal

[tool.pytest.ini_options]
addopts = "-m 'not stress'"
markers = [
    "stress: large-volume run, CI-only (pytest -m stress)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.sql.pandas.utils",
    "ignore::DeprecationWarning:pyspark.sql.pandas.conversion",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
