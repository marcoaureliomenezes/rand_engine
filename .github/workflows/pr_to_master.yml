name: PR to Master Validation

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate_source:
    name: Validate PR from Development
    runs-on: ubuntu-latest
    steps:
      - name: Verify source is development
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "development" ]; then
            echo "❌ PRs to master must come from development branch!"
            echo "Current source: $SOURCE_BRANCH"
            exit 1
          fi
          echo "✅ PR from development branch"

  test:
    name: Run Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11', pins: 'pandas==2.2.0 numpy==1.26.0 pyarrow==19.0.0 faker==28.4.1 "pyspark>=3.5,<4"'}
          - {os: windows-latest, python-version: '3.11', pins: '"pyspark>=3.5,<4"'}
          - {os: macos-latest, python-version: '3.11', pins: '"pyspark>=3.5,<4"'}
          - {os: ubuntu-latest, python-version: '3.12', pins: '"pyspark>=4"'}
          - {os: windows-latest, python-version: '3.12', pins: '"pyspark>=4"'}
          - {os: macos-latest, python-version: '3.12', pins: '"pyspark>=4"'}
          - {os: ubuntu-latest, python-version: '3.13', pins: '"pyspark>=4"'}
          - {os: windows-latest, python-version: '3.13', pins: '"pyspark>=4"'}
          - {os: macos-latest, python-version: '3.13', pins: '"pyspark>=4"'}
          - {os: ubuntu-latest, python-version: '3.14', pins: '"pyspark>=4"'}
          - {os: windows-latest, python-version: '3.14', pins: '"pyspark>=4"'}
          - {os: macos-latest, python-version: '3.14', pins: '"pyspark>=4"'}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Temurin Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Install package and pinned test stack
        run: python -m pip install ".[faker]" pytest pytest-cov setuptools ${{ matrix.pins }}

      - name: Print resolved versions
        run: python -c "import numpy, pandas, pyarrow, faker, pyspark; print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'pyarrow', pyarrow.__version__, 'faker', faker.VERSION, 'pyspark', pyspark.__version__)"
      
      - name: Install Poetry with pipx (wheel fixture)
        run: pipx install poetry==2.5.1

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=rand_engine --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage
        continue-on-error: true
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  summary:
    name: PR Validation Summary
    needs: [validate_source, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate_source.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All checks passed - PR ready to merge to master"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
