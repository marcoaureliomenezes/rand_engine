name: Docs

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - 'feature/**'
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install docs dependencies
        run: poetry install --only docs --no-root --no-interaction

      - name: Prepare and build isolated site (strict)
        run: |
          output="$RUNNER_TEMP/rand-engine-docs"
          python scripts/docs_site.py --output "$output"
          poetry run zensical build --strict --config-file "$output/input/mkdocs.yml"
          cp -a "$output/public/." "$output/input/site/"
          test -f "$output/input/site/llms.txt"
          test -f "$output/input/site/skills/rand-engine/SKILL.md"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/rand-engine-docs/input/site

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    concurrency:
      group: pages-public-site
      queue: max
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
