name: Docs

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - 'feature/**'
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install docs dependencies
        run: poetry install --only docs --no-root --no-interaction

      - name: Home page from README
        run: cp README.md docs/index.md

      - name: Build site (strict)
        run: poetry run zensical build --strict

      - name: Serve llms.txt and Markdown sources
        run: |
          cp llms.txt site/llms.txt
          (cd docs && find . -name '*.md' -exec cp --parents {} ../site/ \;)
          test -f site/llms.txt

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
