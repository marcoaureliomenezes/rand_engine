name: Benchmarks

on:
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Stress tests and speed benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: poetry install --with test --no-interaction
      - name: Run stress tests
        run: poetry run pytest -m stress --durations=20
      - name: Speed benchmark
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: poetry run python -m benchmarks.speed --baseline docs/benchmarks.json --out docs/
      - name: Job summary
        if: ${{ !cancelled() }}
        run: cat docs/BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"
      - name: PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file docs/BENCHMARKS.md
      - name: Upload benchmark artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            docs/benchmarks.json
            docs/BENCHMARKS.md
