schema_version = "1.4"

[metadata]
description = "Usage: build a seeded Spark DataFrame from a spec on local[1] and save it as parquet"

[task]
round = "usage"
legs = ["pypi", "wheel"]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 600.0

[environment]
requirements = ["pyspark>=3.5,<4", "setuptools>=84.1.0"]
